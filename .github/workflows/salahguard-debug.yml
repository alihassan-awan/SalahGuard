name: SalahGuard Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/salahguard-debug.yml'

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore fixed development signing key
        run: base64 --decode .github/salahguard-debug.keystore.base64 > salahguard-debug.jks

      - name: Run unit tests (retry transient Robolectric dependency fetch)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :app:testDebugUnitTest; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Unit tests still failing after three attempts'
              exit 1
            fi
            echo "Retrying unit tests after failure (attempt ${attempt}/3)"
            sleep 12
          done

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SalahGuard-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
